services:
  floci:
    build:
      context: .
      dockerfile: docker/Dockerfile
    tty: true
    ports:
      - "4566:4566"
      - "6379-6399:6379-6399"
      - "7001-7099:7001-7099"
      - "9200-9299:9200-9299"
    volumes:
      # Persistencia real: floci guarda datos en /app/data (FLOCI_STORAGE_PERSISTENT_PATH)
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_SERVICES_DOCKER_NETWORK: floci_default
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: "true"
    networks:
      floci_default:
        aliases:
          - localhost.floci.io

  floci-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - floci
    networks:
      - floci_default

networks:
  floci_default:
    name: floci_default
