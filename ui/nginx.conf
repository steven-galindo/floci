server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy to Floci emulator (container-to-container, never exposed to the browser)
    location /api/ {
        proxy_pass http://floci:4566/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass AWS SDK headers through
        proxy_pass_request_headers on;
    }

    # No cache for runtime config
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback: all unmatched paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with moderate cache
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
